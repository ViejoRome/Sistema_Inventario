<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Registro de clientes</h1>
    <p class="intro">Agrega clientes y consulta sus datos en el listado.</p>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Nuevo cliente</h2>
      <form id="customer-form">
        <label for="customer-name">
          Nombre completo
          <input id="customer-name" name="name" type="text" autocomplete="name" required>
        </label>
        <label for="customer-email">
          Correo electrónico
          <input id="customer-email" name="email" type="email" autocomplete="email" required>
        </label>
        <label for="customer-phone">
          Teléfono
          <input id="customer-phone" name="phone" type="tel" autocomplete="tel" required>
        </label>
        <button type="submit">Registrar cliente</button>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Clientes registrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Correo electrónico</th>
              <th scope="col">Teléfono</th>
            </tr>
          </thead>
          <tbody id="customer-list">
            <tr id="empty-message">
              <td colspan="3">Aún no hay clientes registrados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
